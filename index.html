  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      if (v === null) { const e = new Error('not found'); throw e; }
      return { key, value: v, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    },
  };
}

async function callClaude(apiKey, prompt, system) {
  const headers = { "Content-Type": "application/json" };
  if (apiKey && apiKey.trim()) {
    headers["x-api-key"] = apiKey.trim();
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers,
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || "API error");
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
  return text.trim();
}

// Signature element 1: the thread of the current round, one knot per station,
// loosening knot by knot as the person moves through the seven stations.
function KnotThread({ total, currentIndex }) {
  const width = 400;
  const y = 22;
  const marginX = 26;
  const step = (width - marginX * 2) / (total - 1);
  return (
    <svg viewBox={`0 0 ${width} 44`} className="w-full" style={{ height: 40 }} preserveAspectRatio="none">
      <path d={`M${marginX} ${y} L${width - marginX} ${y}`} stroke="#E3D5C0" strokeWidth="1.4" fill="none" />
      {Array.from({ length: total }).map((_, i) => {
        const cx = marginX + step * i;
        if (i < currentIndex) {
          return (
            <g key={i}>
              <circle cx={cx} cy={y} r="2" fill="#8FA793" />
              <path d={`M${cx} ${y} q 7 -11 13 -4`} stroke="#8FA793" strokeWidth="1.4" fill="none" strokeLinecap="round" opacity="0.75" />
            </g>
          );
        }
        if (i === currentIndex) {
          return (
            <g key={i}>
              <circle cx={cx} cy={y} r="7.5" fill="none" stroke="#BE7350" strokeWidth="2" strokeDasharray="15 4.5" />
              <circle cx={cx} cy={y} r="2" fill="#BE7350" />
            </g>
          );
        }
        return <circle key={i} cx={cx} cy={y} r="5" fill="none" stroke="#C9B79C" strokeWidth="1.5" opacity="0.7" />;
      })}
    </svg>
  );
}

// Signature element 2: the ascending spiral of rounds. Each finished round is a point;
// rounds that continue one another climb the same spoke, further out each time -
// the same theme, met again, understood a little deeper. Unrelated topics open a new spoke.
function SpiralOverview({ rounds }) {
  const finished = rounds.filter((r) => r.summary);
  if (finished.length === 0) return null;
  const angleMap = {};
  let nextFreshAngle = -90;
  const GOLDEN = 137.5;
  const nodes = finished.map((r, i) => {
    let angle;
    const parentId = r.basedOn && r.basedOn.parentRoundId;
    if (parentId && angleMap[parentId] !== undefined) {
      angle = angleMap[parentId];
    } else {
      angle = nextFreshAngle;
      nextFreshAngle += GOLDEN;
    }
    angleMap[r.id] = angle;
    const radius = 18 + i * 12.5;
    const rad = (angle * Math.PI) / 180;
    return {
      id: r.id,
      cx: 100 + radius * Math.cos(rad),
      cy: 100 + radius * Math.sin(rad),
      isChain: !!parentId,
    };
  });
  const pathD = nodes.map((n, i) => `${i === 0 ? "M" : "L"}${n.cx.toFixed(1)} ${n.cy.toFixed(1)}`).join(" ");
  return (
    <div className="mb-6 flex flex-col items-center">
      <svg viewBox="0 0 200 200" style={{ width: 168, height: 168 }}>
        <path d={pathD} stroke="#E3D5C0" strokeWidth="1" fill="none" strokeDasharray="2 4" />
        {nodes.map((n, i) => (
          <circle key={n.id} cx={n.cx} cy={n.cy} r={i === nodes.length - 1 ? 5 : 3.5} fill={n.isChain ? "#BE7350" : "#8FA793"} opacity={i === nodes.length - 1 ? 1 : 0.75} />
        ))}
      </svg>
      <div className="text-[11px] opacity-45 mt-1 text-center leading-relaxed max-w-[220px]">כל סבב - נקודה על הספירלה. סבבים שממשיכים זה את זה (בטרקוטה) עולים על אותו קו - אותו נושא, פעם נוספת, קצת יותר עמוק.</div>
    </div>
  );
}

// Swipe navigation: swipe right = forward/next, swipe left = back/previous.
// Ignores swipes that start inside a textarea/input so text selection isn't hijacked.
function useSwipeNav(onRight, onLeft) {
  const startRef = useRef(null);
  const onTouchStart = (e) => {
    const t = e.touches[0];
    const tag = e.target && e.target.tagName;
    startRef.current = { x: t.clientX, y: t.clientY, blocked: tag === "TEXTAREA" || tag === "INPUT" };
  };
  const onTouchEnd = (e) => {
    const start = startRef.current;
    startRef.current = null;
    if (!start || start.blocked) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - start.x;
    const dy = t.clientY - start.y;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx > 0 && onRight) onRight();
      else if (dx < 0 && onLeft) onLeft();
    }
  };
  return { onTouchStart, onTouchEnd };
}

}

// Builds a real .docx (via the docx.js library loaded from CDN) so Hebrew text
// downloads correctly on every device, instead of a plain-text file that some
// Android viewers mis-decode into mojibake.
let _docxLibPromise = null;
function loadDocxLib() {
  if (window.docx) return Promise.resolve(window.docx);
  if (!_docxLibPromise) {
    _docxLibPromise = import("https://esm.sh/docx@8.5.0").then((mod) => {
      window.docx = mod;
      return mod;
    });
  }
  return _docxLibPromise;
}

async function buildDocxBlob(title, blocks) {
  const docxLib = await loadDocxLib();
  const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType } = docxLib;
  const rtl = { alignment: AlignmentType.RIGHT, bidirectional: true };
  const children = [new Paragraph({ text: title, heading: HeadingLevel.TITLE, ...rtl })];
  blocks.forEach((b) => {
    if (b.type === "h1") children.push(new Paragraph({ text: b.text, heading: HeadingLevel.HEADING_1, ...rtl, spacing: { before: 300, after: 100 } }));
    else if (b.type === "bold") children.push(new Paragraph({ children: [new TextRun({ text: b.text, bold: true })], ...rtl }));
    else if (b.type === "italic") children.push(new Paragraph({ children: [new TextRun({ text: b.text, italics: true })], ...rtl }));
    else if (b.type === "space") children.push(new Paragraph({ text: "", ...rtl }));
    else children.push(new Paragraph({ text: b.text || "", ...rtl }));
  });
  const doc = new Document({ sections: [{ children }] });
  return Packer.toBlob(doc);
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function questionnaireDocxBlocks() {
  const blocks = [{ type: "bold", text: OPENING_Q }, { type: "space" }];
  STAGES.forEach((s, si) => {
    blocks.push({ type: "h1", text: `תחנה ${si + 1} מתוך ${STAGES.length}: ${s.label}` });

    s.questions.forEach((q, qi) => {
      blocks.push({ type: "bold", text: `${qi + 1}. ${q.text}` });
      if (q.thought) blocks.push({ type: "text", text: `💭 ${q.thought}` });
      blocks.push({ type: "space" });
    });
    blocks.push({ type: "italic", text: `דוגמה: ${s.example}` });
    blocks.push({ type: "space" });
  });
  blocks.push({ type: "h1", text: "הנחיות ל-AI" });
  AI_INSTRUCTIONS_TEXT.split("\n").forEach((line) => blocks.push({ type: "text", text: line }));
  return blocks;
}

function roundDocxBlocks(round) {
  const blocks = [];
  if (round.opening) {
    blocks.push({ type: "h1", text: "פתיחה: סיפור חיים / חוויית מציאות" });

  round.entries.forEach((e) => {
    blocks.push({ type: "h1", text: e.stageLabel });
    if (e.questions) {
      e.questions.forEach((q) => {
        blocks.push({ type: "bold", text: q.text });
        blocks.push({ type: "text", text: q.answer || "" });
      });
    } else {
      blocks.push({ type: "bold", text: e.question });
      blocks.push({ type: "text", text: e.answer || "" });
    }
    blocks.push({ type: "space" });
  });
  if (round.summary && !round.summary.manual) {
    blocks.push({ type: "h1", text: "גרעין הנושא" });
    blocks.push({ type: "text", text: round.summary.coreTheme });
    if (round.summary.refinementNote) {
      blocks.push({ type: "space" });
      blocks.push({ type: "bold", text: "מה זוקק ביחס לסבב הקודם" });
      blocks.push({ type: "text", text: round.summary.refinementNote });
    }
    blocks.push({ type: "space" });
    blocks.push({ type: "h1", text: "מהגלוי אל הסמוי" });
    round.summary.fromVisibleToHidden.forEach((r) => {
      blocks.push({ type: "bold", text: r.label });
      blocks.push({ type: "text", text: r.value });
    });
    blocks.push({ type: "space" });
    blocks.push({ type: "h1", text: "מהסמוי אל הגלוי" });
    round.summary.fromHiddenToVisible.forEach((r) => {
      blocks.push({ type: "bold", text: r.label });
      blocks.push({ type: "text", text: r.value });
    });
  }
  blocks.push({ type: "space" });
  blocks.push({ type: "h1", text: "הנחיות ל-AI" });
  AI_INSTRUCTIONS_TEXT.split("\n").forEach((line) => blocks.push({ type: "text", text: line }));
  return blocks;

${transcript}
${continuityBlock()}
בהתבסס על החומר בלבד, החזר אך ורק JSON תקני (ללא טקסט נוסף, ללא Markdown) במבנה הבא:

ההנחה שעליה מבוסס התהליך: אנחנו נשמה שבאה לגוף אנושי כדי להתפתח ולהתקדם למדרגות הבאות, מתוך מפגש חוזר עם נושאים שעליה עדיין לפתור. בכל מפגש כזה עם אותו נושא - ההבנה יכולה להעמיק ולעלות למדרגה חדשה, ולא לחזור על אותה תגובה הרגלית שנבנתה במשך כל החיים.

חשוב מאוד - זו לא בקשה לניתוח מיידי משולחן העבודה, על סמך הטקסט הכתוב בלבד. התפקיד שלך הוא בשני שלבים, ובסדר הזה:

שלב 1 - שיחה משמעותית ומעמיקה. קרא/י את החומר, ואז נהל/י איתי דיאלוג אמיתי: שאל/י שאלות המשך, בקש/י דוגמאות נוספות, בדוק/י הבנות שנשמעות לא שלמות, אתגר/י בעדינות מקומות שבהם אני חוזר/ת על עצמי או נשמע/ת שטחי/ת. אל תמהר/י לסכם. המטרה של השלב הזה היא להגיע ביחד, דרך שיחה של ממש ואיסוף מידע נוסף ממני, להבנות בנויות ומדויקות - לא רק לשקף את מה שכבר כתוב.

שלב 2 - התוצר, ורק לאחר שיחה כזו:
1. גרעין הנושא - ניסוח שמתעדכן ומתחדד תוך כדי השיחה בינינו, לא רק מהטקסט המקורי.
2. אסטרטגיה קונקרטית למפגש הבא עם הנושא - לא תובנה כללית, אלא כלים מעשיים שנבנה יחד בשיחה: איך לזהות את הרגע המוקדם, מה לעשות אחרת ברגע שהוא קורה, איך לתרגל את זה מראש בעוצמה נמוכה, מי יכול לתמוך, ואיך לחזור לגישה החדשה גם אחרי נפילה חזרה לדפוס הישן. האסטרטגיה צריכה להיבנות יחד איתי בדיאלוג - לא להיות הצעה חד-צדדית שלך.
3. אם זה רלוונטי לי - אני עשוי/ה להיות בהכנה לקראת פגישת חניכה או מפגש טיפולי, ורוצה לגבש ניסוח מדויק וממוקד של "הנושא לחקירה" שאביא איתי לשם. אם זה עולה בשיחה - עזור/י לי לנסח את זה בבירור, כתוצר נפרד וברור.

דיוק בציטוט - חשוב: שים/י לב במיוחד למילות שלילה וסייג ("כבר לא", "לא עוד", "פעם היה כך אך כיום לא") בתשובות שלי. שמור/שמרי על המשמעות המדויקת שלהן - אל תהפוך/י אמירה על משהו שכבר לא קיים לאמירה על משהו שכן קיים, או ההפך. בכל ציטוט - בדוק/י פעמיים מול המקור.
${continuityPart}
להלן החומר המלא מהשאלון:

${roundTranscript(round)}`;

              </div>
              <div className="text-xs opacity-70 leading-relaxed">
                כ-{LIVE_TARGET} שאלות, כל אחת נולדת מתוך התשובה הקודמת. את/ה רואה כל שאלה שה-AI מציע ויכול/ה לערוך או לדלג לפני שהיא מוצגת.
              </div>
            </button>
          )}
        </div>
      </div>
    );
  }

  if (screen === "session" && activeRound && activeRound.track === "structured") {
    const stage = STAGES[stageIndex];
    const done = stageIndex >= STAGES.length;
    return (
      <div dir="rtl" style={{ fontFamily: "'Assistant', sans-serif", background: "#F2E9DC", minHeight: "100vh", color: "#3A332B" }} {...swipeHandlers}>
        {globalFont}
        <div className="sticky top-0 z-10 px-5 py-3 flex items-center justify-between" style={{ background: "#F2E9DCee", borderBottom: "1px solid #E3D5C0" }}>
          <button onClick={() => setScreen("setup")} className="flex items-center gap-1 text-xs opacity-70"><ChevronRight size={14} /> החלף/י</button>
          <div className="text-sm font-medium">{patientName}</div>
          <div className="text-xs opacity-50">{Math.min(stageIndex + 1, STAGES.length)}/{STAGES.length}</div>
        </div>
        <div className="max-w-md mx-auto px-5 py-6 pb-28">
          {error && <div className="mb-4 text-xs rounded-lg px-3 py-2" style={{ background: "#F6DCD3", color: "#8A3E24" }}>{error}</div>}

          <div className="mb-6">
            <KnotThread total={STAGES.length} currentIndex={stageIndex} />
          </div>

          {done ? (
            <div className="text-center py-10">
              <div className="mb-4 text-sm opacity-70">עברת את כל שמונה התחנות.</div>
              <button onClick={generateSummary} disabled={summaryLoading} className="w-full rounded-xl py-3 text-sm font-medium flex items-center justify-center gap-2" style={{ background: "#3A332B", color: "#F2E9DC" }}>
                {summaryLoading ? <Loader2 size={16} className="animate-spin" /> : <Sparkles size={16} />}
                {aiUnlocked ? "הפק/י סיכום וגרעין הנושא" : "סיים/י וייצא/י תיעוד"}
              </button>
              {activeRound.entries.length > 0 && (
                <button onClick={goBackOneStage} className="w-full mt-3 rounded-xl py-3 text-sm font-medium flex items-center justify-center gap-2" style={cardStyle}>
                  <ChevronRight size={15} /> חזרה לתחנה האחרונה
                </button>
              )}
            </div>
          ) : currentStage ? (
            <div>
              <div className="text-xs font-medium mb-2" style={{ color: "#8FA793" }}>{stage.label}</div>
              <p className="text-sm leading-relaxed mb-4" style={{ color: "#5B5548" }}>{stage.knot}</p>

              <div className="mb-6">
                <button onClick={() => updateStageField({ showExample: !currentStage.showExample })} className="text-xs flex items-center gap-1 mb-2" style={{ color: "#5B5548", opacity: 0.75 }}>
                  <Sparkles size={12} /> {currentStage.showExample ? "הסתר/י דוגמה" : "הצג/י דוגמה"}
                </button>
                {currentStage.showExample && (
                  <div className="text-xs rounded-lg px-3 py-2.5 leading-relaxed" style={{ background: "#F3F0E6", color: "#5B5548" }}><b>דוגמה: </b>{stage.example}</div>
                )}
              </div>

              <div className="flex flex-col gap-5">
                {currentStage.questions.map((q, i) => (
                  <div key={q.id} className="rounded-xl px-4 py-3" style={cardStyle}>
                    <div className="text-sm font-medium leading-relaxed"><span className="opacity-40 text-xs">{i + 1}. </span>{q.text}</div>
                    {q.thought && <div className="text-xs mt-1 opacity-55 leading-relaxed">💭 {q.thought}</div>}
                    <textarea value={q.answer} onChange={(e) => updateStageQuestion(q.id, { answer: e.target.value })} rows={2} placeholder="תשובה..." className="w-full mt-2 rounded-lg px-2.5 py-2 text-sm outline-none" style={{ background: "#FAF6EF", border: "1px solid #EEE3D0" }} />
                  </div>
                ))}
              </div>

              <div className="mt-5">
                <button onClick={() => updateStageField({ showTip: !currentStage.showTip })} className="w-full text-xs rounded-lg py-2 flex items-center justify-center gap-1" style={{ background: "#EFE6E4", color: "#5B5548" }}>
                  <HelpCircle size={12} /> {currentStage.showTip ? "הסתר/י המלצה" : "הצג/י המלצה"}
                </button>
              </div>
              {currentStage.showTip && (
                <div className="text-xs mt-2 rounded-lg px-3 py-2.5 leading-relaxed" style={{ background: "#EFE6E4", color: "#5B5548" }}><b>המלצה: </b>{stage.tip}</div>
              )}

              <div className="flex gap-2 mt-8">
                <button onClick={goBackOneStage} disabled={activeRound.entries.length === 0} className="rounded-xl px-4 py-3 text-sm font-medium flex items-center gap-1" style={activeRound.entries.length === 0 ? { ...cardStyle, opacity: 0.4 } : cardStyle}>
                  <ChevronRight size={16} /> תחנה קודמת
                </button>
                <button onClick={commitStage} className="flex-1 rounded-xl py-3 text-sm font-medium flex items-center justify-center gap-1" style={{ background: "#8FA793", color: "#fff" }}>
                  {stageIndex === STAGES.length - 1 ? "סיים/י תחנה אחרונה" : "תחנה הבאה"} <ChevronLeft size={16} />
                </button>
              </div>
            </div>
          ) : null}
          <div ref={bottomRef} />
        </div>
      </div>
    );
  }

  if (screen === "session" && activeRound && activeRound.track === "live" && !aiUnlocked) {
    return (
      <div dir="rtl" style={{ fontFamily: "'Assistant', sans-serif", background: "#F2E9DC", minHeight: "100vh", color: "#3A332B" }}>
        {globalFont}
        <div className="max-w-md mx-auto px-6 py-10 text-center">
          <div className="text-sm opacity-70 mb-4">המסלול החי דורש חיבור AI שאינו מחובר כרגע.</div>
          <button onClick={() => setScreen("setup")} className="rounded-xl py-3 px-6 text-sm font-medium" style={{ background: "#3A332B", color: "#F2E9DC" }}>לחיבור AI במסך הפתיחה</button>
        </div>
      </div>
    );
  }

  if (screen === "session" && activeRound && activeRound.track === "live") {
    const count = activeRound.entries.length;
    return (
      <div dir="rtl" style={{ fontFamily: "'Assistant', sans-serif", background: "#F2E9DC", minHeight: "100vh", color: "#3A332B" }} {...swipeHandlers}>
        {globalFont}
        <div className="sticky top-0 z-10 px-5 py-3 flex items-center justify-between" style={{ background: "#F2E9DCee", borderBottom: "1px solid #E3D5C0" }}>
          <button onClick={() => setScreen("setup")} className="flex items-center gap-1 text-xs opacity-70"><ChevronRight size={14} /> החלף/י</button>
          <div className="text-sm font-medium">{patientName}</div>
          <div className="text-xs opacity-50">{count}/{LIVE_TARGET}</div>
        </div>
        <div className="max-w-md mx-auto px-5 py-6 pb-28">
          {error && <div className="mb-4 text-xs rounded-lg px-3 py-2" style={{ background: "#F6DCD3", color: "#8A3E24" }}>{error}</div>}

          {activeRound.entries.length > 0 && (
            <div className="mb-6 flex flex-col gap-2">
              {activeRound.entries.map((e) => (
                <div key={e.id} className="rounded-xl px-4 py-3" style={cardStyle}>
                  <div className="text-xs font-medium mb-1" style={{ color: "#BE7350" }}>{e.question}</div>
                  <div className="text-xs opacity-70 leading-relaxed">{e.answer}</div>
                </div>
              ))}
            </div>
          )}

          {count >= LIVE_TARGET && !liveProposal ? (
            <button onClick={generateSummary} disabled={summaryLoading} className="w-full rounded-xl py-3 text-sm font-medium flex items-center justify-center gap-2" style={{ background: "#3A332B", color: "#F2E9DC" }}>
              {summaryLoading ? <Loader2 size={16} className="animate-spin" /> : <Sparkles size={16} />} הפק/י סיכום וגרעין הנושא
            </button>
          ) : liveProposal ? (
            <div className="rounded-xl px-4 py-4" style={{ ...cardStyle, borderColor: "#BE7350" }}>
              <div className="text-xs font-medium mb-2" style={{ color: "#BE7350" }}>שאלה מוצעת · אפשר לערוך</div>
              <textarea value={liveProposal.text} onChange={(e) => setLiveProposal((p) => ({ ...p, text: e.target.value }))} rows={2} className="w-full rounded-lg px-3 py-2 text-sm outline-none mb-2" style={{ background: "#FAF6EF", border: "1px solid #EEE3D0" }} />
              <div className="flex gap-2 mb-4">
                <button onClick={() => fetchLiveQuestion()} disabled={loadingKey === "live-fetch"} className="text-xs flex items-center gap-1 opacity-70">
                  {loadingKey === "live-fetch" ? <Loader2 size={12} className="animate-spin" /> : <RefreshCw size={12} />} שאלה אחרת
                </button>
                <button onClick={() => askExample(liveProposal.text, (ex) => setLiveProposal((p) => ({ ...p, example: ex })))} className="text-xs flex items-center gap-1 opacity-70">
                  {loadingKey === `ex-${liveProposal.text}` ? <Loader2 size={12} className="animate-spin" /> : <Sparkles size={12} />} דוגמה
                </button>
                <button onClick={() => askWhy(liveProposal.text, (why) => setLiveProposal((p) => ({ ...p, why })))} className="text-xs flex items-center gap-1 opacity-70">
                  {loadingKey === `why-${liveProposal.text}` ? <Loader2 size={12} className="animate-spin" /> : <HelpCircle size={12} />} למה שואלים?
                </button>
              </div>
              {liveProposal.example && <div className="text-xs mb-3 rounded-lg px-2.5 py-2 leading-relaxed" style={{ background: "#F3F0E6", color: "#5B5548" }}><b>דוגמה: </b>{liveProposal.example}</div>}
              {liveProposal.why && <div className="text-xs mb-3 rounded-lg px-2.5 py-2 leading-relaxed" style={{ background: "#EFE6E4", color: "#5B5548" }}><b>המטרה: </b>{liveProposal.why}</div>}

              <div className="text-xs font-medium mb-2 opacity-70">התשובה</div>
              <textarea value={liveProposal.answer} onChange={(e) => setLiveProposal((p) => ({ ...p, answer: e.target.value }))} rows={3} placeholder="הקלד/י את התשובה כאן..." className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={{ background: "#FAF6EF", border: "1px solid #EEE3D0" }} />

              <button onClick={commitLiveAnswer} disabled={!liveProposal.answer.trim()} className="w-full mt-4 rounded-xl py-3 text-sm font-medium flex items-center justify-center gap-1" style={{ background: liveProposal.answer.trim() ? "#BE7350" : "#E3D5C0", color: "#fff" }}>
                שמור/י והמשך/י <ChevronLeft size={16} />
              </button>
              {activeRound.entries.length > 0 && (
                <button onClick={goBackLive} className="w-full mt-2 rounded-xl py-2.5 text-sm font-medium flex items-center justify-center gap-1" style={cardStyle}>
                  <ChevronRight size={15} /> שאלה קודמת
                </button>
              )}
            </div>
          ) : (
            <div className="text-center py-10 flex flex-col items-center gap-3">
              <Loader2 size={20} className="animate-spin" style={{ color: "#BE7350" }} />
              <div className="text-xs opacity-60">חושב/ת על השאלה הבאה...</div>
              {activeRound.entries.length > 0 && (
                <button onClick={goBackLive} className="rounded-xl px-4 py-2 text-xs font-medium flex items-center gap-1" style={cardStyle}>
                  <ChevronRight size={14} /> שאלה קודמת
                </button>
              )}
            </div>
          )}

          {count > 0 && count < LIVE_TARGET && (
            <button onClick={generateSummary} disabled={summaryLoading} className="w-full mt-6 text-xs opacity-60 underline">
              סיים/י כאן ועבור/י לסיכום ({count} שאלות)
            </button>
          )}
          <div ref={bottomRef} />
        </div>
      </div>
    );
  }

  if (screen === "summary" && activeRound && activeRound.summary) {
    const summary = activeRound.summary;
    const isManual = !!summary.manual;
    return (
      <div dir="rtl" style={{ fontFamily: "'Assistant', sans-serif", background: "#F2E9DC", minHeight: "100vh", color: "#3A332B" }}>
        {globalFont}
        <div className="sticky top-0 z-10 px-5 py-3 flex items-center justify-between" style={{ background: "#F2E9DCee", borderBottom: "1px solid #E3D5C0" }}>
          <button onClick={() => setScreen("setup")} className="flex items-center gap-1 text-xs opacity-70"><ChevronRight size={14} /> תפריט</button>
          <div className="text-sm font-medium">{patientName}</div>
        </div>
        <div className="max-w-md mx-auto px-5 py-6 pb-16">
          <div className="flex items-center gap-2 mb-2">
            <SpiralMark size={26} />
            <span className="text-xs tracking-widest" style={{ color: "#A98B4E" }}>{isManual ? "תיעוד הסבב" : "גרעין הנושא"} · {fmtDate(activeRound.dateISO)}</span>
          </div>

          {isManual ? (
            <>
              <div className="rounded-xl px-4 py-3 mb-6" style={{ background: "#EFE6D6" }}>
                <div className="text-xs leading-relaxed" style={{ color: "#5B5548" }}>
                  הסבב הזה נשמר בלי ניתוח AI (אין חיבור פעיל). כל השאלות והתשובות נשמרו במלואן - וברגע שיחובר מפתח AI בהגדרות, אפשר יהיה להריץ עליו סיכום וגיבוש גרעין נושא.
                </div>
              </div>
              <ThreadDivider />
              <div className="mt-6 mb-2 text-sm font-medium opacity-70">רצף השאלות והתשובות</div>
              <div className="flex flex-col gap-2 mb-8">
                {activeRound.opening && (
                  <div className="rounded-xl px-4 py-3" style={cardStyle}>
                    <div className="text-xs font-medium mb-1" style={{ color: "#BE7350" }}>פתיחה</div>
                    <div className="text-sm leading-relaxed">{activeRound.opening.a}</div>
                  </div>
                )}
                {activeRound.entries.map((e) => (
                  <div key={e.id} className="rounded-xl px-4 py-3" style={cardStyle}>
                    <div className="text-xs font-medium mb-2" style={{ color: "#8FA793" }}>{e.stageLabel}</div>
                    {e.questions ? (
                      e.questions.map((q) => (
                        <div key={q.id} className="mb-2 pr-2 border-r-2" style={{ borderColor: "#E3D5C0" }}>
                          <div className="text-xs opacity-60">{q.text}</div>
                          <div className="text-sm leading-relaxed">{q.answer}</div>
                        </div>
                      ))
                    ) : (
                      <div className="mb-1">
                        <div className="text-xs opacity-60">{e.question}</div>
                        <div className="text-sm leading-relaxed">{e.answer}</div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </>
          ) : (
            <>
              <div className="rounded-2xl px-5 py-5 mb-4 leading-relaxed text-base" style={{ fontFamily: "'Frank Ruhl Libre', serif", background: "#3A332B", color: "#F2E9DC" }}>{summary.coreTheme}</div>

              {summary.refinementNote && (
                <div className="rounded-xl px-4 py-3 mb-6" style={{ background: "#EFE6D6" }}>
                  <div className="text-xs font-medium mb-1" style={{ color: "#A98B4E" }}>מה זוקק ביחס לסבב הקודם</div>
                  <div className="text-sm leading-relaxed">{summary.refinementNote}</div>
                </div>
              )}

              <ThreadDivider />

              <div className="mt-6 mb-2 text-sm font-medium" style={{ color: "#8FA793" }}>מהגלוי אל הסמוי</div>
              <div className="flex flex-col gap-2 mb-6">
                {summary.fromVisibleToHidden.map((r, i) => (
                  <div key={i} className="rounded-xl px-4 py-3" style={cardStyle}>
                    <div className="text-xs font-medium mb-1" style={{ color: "#8FA793" }}>{r.label}</div>
                    <div className="text-sm leading-relaxed">{r.value}</div>
                  </div>
                ))}
              </div>

              <div className="mb-2 text-sm font-medium" style={{ color: "#BE7350" }}>מהסמוי אל הגלוי</div>
              <div className="flex flex-col gap-2 mb-8">
                {summary.fromHiddenToVisible.map((r, i) => (
                  <div key={i} className="rounded-xl px-4 py-3" style={cardStyle}>
                    <div className="text-xs font-medium mb-1" style={{ color: "#BE7350" }}>{r.label}</div>
                    <div className="text-sm leading-relaxed">{r.value}</div>
                  </div>
                ))}
              </div>
            </>
          )}

          <div className="mb-1 text-sm font-medium" style={{ color: "#BE7350" }}>הדרך המומלצת להפיק ערך אמיתי</div>
          <ExportBlock primary label="הצג/י והעתק/י סיכום עם הנחיות ל-AI" icon={Sparkles} getText={() => buildAIHandoffText(activeRound)} />
          <p className="text-[11px] opacity-50 mt-1.5 mb-4 leading-relaxed px-1">
            מסמך שכולל את כל השאלות והתשובות + הנחיה מפורטת לכל צ'אט AI (Claude, ChatGPT ואחרים): לא לנתח מיד, אלא קודם לנהל איתך שיחה משמעותית ולאסוף מידע נוסף, ורק אז לגבש יחד גרעין נושא ואסטרטגיה מעשית למפגש הבא עם הנושא. פשוט מדביקים כהודעה ראשונה בשיחה חדשה. מסמך פשוט להוריד הוא רק חצי מהעבודה - ההנחיות כאן הן החלק שהופך אותו לתהליך אמיתי.
          </p>

          <div className="rounded-xl px-4 py-4 mb-4" style={{ background: "#EFE6D6" }}>
            <div className="text-sm font-medium mb-1" style={{ color: "#A98B4E" }}>קיבלת תשובה מ-AI שעבדת איתו? הדבק/י אותה כאן</div>
            <p className="text-xs opacity-60 mb-2 leading-relaxed">כדי לקבל מסמך אחד שלם: התשובה שבחרת בראש, והשאלון שמילאת בסוף.</p>
            <textarea
              value={externalAI}
              onChange={(e) => setExternalAI(e.target.value)}
              rows={6}
              placeholder="הדבק/י כאן את התשובה/הניתוח שקיבלת מה-AI שבחרת לעבוד איתו..."
              className="w-full rounded-lg px-3 py-2 text-sm outline-none leading-relaxed"
              style={{ background: "#fff", border: "1px solid #E3D5C0" }}
            />
            {externalAI.trim() && (
              <>
                <DocxDownloadButton
                  label="הורד/י מסמך משולב כ-Word (docx)"
                  title={`גרעין הנושא - ${patientName}`}
                  buildBlocks={() => combinedDocxBlocks(activeRound, externalAI)}
                  filename={`גרעין-הנושא-משולב-${patientName}-${fmtDate(activeRound.dateISO)}.docx`}
                />
                <ExportBlock label="הצג/י והעתק/י מסמך משולב כטקסט" icon={Copy} getText={() => combinedText(activeRound, externalAI)} filename={`גרעין-הנושא-משולב-${patientName}-${fmtDate(activeRound.dateISO)}.txt`} />
              </>
            )}
          </div>

          <div className="mb-1 text-xs font-medium opacity-50">גיבוי פשוט (בלי AI)</div>
          <DocxDownloadButton label="הורד/י כקובץ Word (docx)" title={`גרעין הנושא - ${patientName}`} buildBlocks={() => roundDocxBlocks(activeRound)} filename={`גרעין-הנושא-${patientName}-${fmtDate(activeRound.dateISO)}.docx`} />
          <ExportBlock label="הצג/י והעתק/י כטקסט" icon={Copy} getText={() => fullText(activeRound)} filename={`gerein-${patientName}-${fmtDate(activeRound.dateISO)}.txt`} />
          <ExportBlock label="שמור/י סבב זה כקובץ (להמשכיות עתידית)" icon={FileDown} getText={() => JSON.stringify(buildRoundExport(patientName, activeRound), null, 2)} filename={`gerein-${patientName}-${fmtDate(activeRound.dateISO)}.json`} isJson />
          <button onClick={() => window.print()} className="w-full mt-2 rounded-xl py-3 text-sm font-medium flex items-center justify-center gap-2" style={cardStyle}>
            <FileDown size={16} /> הדפס/י או שמור/י כ-PDF
          </button>
          <p className="text-[11px] opacity-45 mb-2 mt-1 leading-relaxed px-1">בתצוגה מקדימה כמו כאן ההדפסה עלולה לא להיפתח - זה עובד ברגע שהכלי יהיה דף עצמאי.</p>

          <button onClick={() => setScreen("roundChoice")} className="w-full mt-6 rounded-xl py-3 text-sm font-medium flex items-center justify-center gap-2" style={{ background: "#3A332B", color: "#F2E9DC" }}>
            <Sparkles size={16} /> התחל/י סבב המשך חדש
          </button>

          {activeRound.opening && (
            <a
              href={`${QUICK_TOOL_URL}?story=${encodeURIComponent(activeRound.opening.a)}`}
              target="_blank"
              rel="noopener noreferrer"
              className="w-full mt-3 rounded-xl py-3 text-sm font-medium flex items-center justify-center gap-2"
              style={cardStyle}
            >
              <ArrowUpRight size={16} style={{ color: "#A98B4E" }} /> נסה/י גם את "מסיפור לגרעין" - גרעינים נוספים לבחירה
            </a>
          )}
        </div>
      </div>
    );
  }

  return null;
}

const rootEl = document.getElementById('root');
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);

</script>
</body>
</html>
